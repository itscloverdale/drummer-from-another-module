# Builds the plugin for every Rack 2 platform on each push. A version tag (vX.Y.Z, matching
# plugin.json) also publishes a GitHub release with the four .vcvplugin packages attached.
name: Build plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: mac-arm64, os: macos-latest, sdk: mac-arm64, cross: '' }
          - { platform: mac-x64, os: macos-latest, sdk: mac-x64, cross: x86_64-apple-darwin }
          - { platform: lin-x64, os: ubuntu-22.04, sdk: lin-x64, cross: '' }
          - { platform: win-x64, os: windows-2022, sdk: win-x64, cross: '' }
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2022' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make tar unzip zip jq zstd mingw-w64-x86_64-gcc
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zstd
      - if: runner.os == 'macOS'
        run: brew install jq zstd || true
      - name: Get Rack SDK
        run: |
          curl -fsSL -o sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q sdk.zip -d "$RUNNER_TEMP" && rm sdk.zip
          echo "RACK_DIR=$(cd "$RUNNER_TEMP/Rack-SDK" && pwd)" >> "$GITHUB_ENV"
      - name: Build
        run: make -j4 dist ${{ matrix.cross && format('CROSS_COMPILE={0}', matrix.cross) || '' }}
      - name: Test
        if: matrix.platform == 'mac-arm64'
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin.json
        run: |
          version=$(jq -r .version plugin.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          name=$(jq -r .name plugin.json)
          { echo; echo "### Install"; echo
            echo "Download the file for your computer, put it in Rack's plugins folder (**Help > Open user folder**, then the \`plugins-<platform>\` folder) and restart Rack."
            echo; echo "- Windows: \`*-win-x64.vcvplugin\`"
            echo "- Mac with Apple Silicon (M1 or later): \`*-mac-arm64.vcvplugin\`"
            echo "- Mac with Intel: \`*-mac-x64.vcvplugin\`"
            echo "- Linux: \`*-lin-x64.vcvplugin\`"; } >> notes.md
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.vcvplugin --title "$NAME $VERSION" --notes-file notes.md
